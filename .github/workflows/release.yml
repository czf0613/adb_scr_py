name: macOS and Windows wheels and PyPI release

on:
  release:
    types: [published]
  # A manual run builds and tests artifacts without publishing to PyPI.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build-wheels:
    name: Build on ${{ matrix.platform.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.platform.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        platform:
          - os: macos-15
            deployment_target: "15.0"
            wheel_platform: macosx-15.0-arm64
          - os: macos-26
            deployment_target: "26.0"
            wheel_platform: macosx-26.0-arm64
        python: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.14t"]
    env:
      CI_PYTHON_VERSION: ${{ matrix.python }}
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      MACOSX_DEPLOYMENT_TARGET: ${{ matrix.platform.deployment_target }}
      WHEEL_PLATFORM: ${{ matrix.platform.wheel_platform }}
      ARCHFLAGS: "-arch arm64"
      RELEASE_TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.13"
          python-version: ${{ matrix.python == '3.14' && '3.14+gil' || matrix.python }}
          enable-cache: true
          cache-dependency-glob: uv.lock
          cache-suffix: release-build-${{ matrix.platform.os }}-${{ matrix.python }}

      - name: Install the target Python interpreter
        # +gil selects an installed regular interpreter; install by version first.
        run: uv python install "$CI_PYTHON_VERSION"

      - name: Verify architecture and release version
        run: |
          test "$(uname -m)" = arm64
          sw_vers
          xcodebuild -version
          if [ "$GITHUB_EVENT_NAME" = release ]; then
            test "$RELEASE_TAG" = "v$(uv version --short)"
          fi

      - name: Install locked dependencies
        run: uv sync --locked --extra mcp --no-install-project

      - name: Build native extension in place
        run: uv run --no-sync setup.py build_ext --inplace

      - name: Build sdist and wheel for the target macOS version
        # Pin the wheel tag as well as ARCHFLAGS: some runner Pythons are universal2.
        run: |
          uv build --sdist --out-dir dist
          uv build --wheel dist/*.tar.gz --out-dir dist --config-setting="--build-option=--plat-name=$WHEEL_PLATFORM"

      - name: Install and verify the built wheel
        run: |
          uv pip install --python .venv/bin/python --no-deps dist/*.whl
          env -u PYTHON_GIL uv run --no-sync python -Werror::RuntimeWarning .github/scripts/check_ci.py "$CI_PYTHON_VERSION"
          test "$(lipo -archs .venv/lib/python*/site-packages/adb_scr/media_ext/*.so)" = arm64

      - name: Save tested distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-wheel-${{ matrix.platform.os }}-${{ matrix.python }}
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 30

      - name: Save test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-build-test-${{ matrix.platform.os }}-${{ matrix.python }}
          path: test-results.xml
          retention-days: 30

  build-windows-wheels:
    name: Build on ${{ matrix.os }} ${{ matrix.arch }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows-2025, python: "3.10", arch: x64, mcp: true}
          - {os: windows-2025, python: "3.11", arch: x64, mcp: true}
          - {os: windows-2025, python: "3.12", arch: x64, mcp: true}
          - {os: windows-2025, python: "3.13", arch: x64, mcp: true}
          - {os: windows-2025, python: "3.14", arch: x64, mcp: true}
          - {os: windows-2025, python: "3.14t", arch: x64, mcp: false}
          - {os: windows-11-arm, python: "3.14", arch: arm64, mcp: false}
          - {os: windows-11-arm, python: "3.14t", arch: arm64, mcp: false}
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONUTF8: "1"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      RELEASE_TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select native Python architecture and ABI
        id: python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python }}
          architecture: ${{ matrix.arch }}

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.13"
          enable-cache: true
          cache-dependency-glob: uv.lock
          cache-suffix: release-windows-${{ matrix.arch }}-${{ matrix.python }}

      - name: Install locked dependencies
        # Match Windows CI: optional MCP dependencies lack ARM64 / cp314t wheels.
        run: uv sync --python "${{ steps.python.outputs.python-path }}" --locked ${{ matrix.mcp && '--extra mcp' || '' }} --no-install-project

      - name: Verify architecture and release version
        run: |
          uv run --no-sync python -c "import sysconfig; assert sysconfig.get_platform() == '${{ matrix.arch == 'arm64' && 'win-arm64' || 'win-amd64' }}', sysconfig.get_platform()"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($env:GITHUB_EVENT_NAME -eq 'release') {
            $version = uv version --short
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            if ($env:RELEASE_TAG -ne "v$version") { throw "Release tag must match v$version" }
          }

      - name: Build native extension in place
        run: uv run --no-sync setup.py build_ext --inplace

      - name: Build sdist and wheel for the target Windows architecture
        run: |
          uv build --python .venv/Scripts/python.exe --sdist --out-dir dist
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $sourceArchive = (Get-ChildItem dist/*.tar.gz).FullName
          uv build --python .venv/Scripts/python.exe --wheel $sourceArchive --out-dir dist

      - name: Install and verify the built wheel
        run: |
          $wheel = (Get-ChildItem dist/*.whl).FullName
          uv pip install --python .venv/Scripts/python.exe --no-deps $wheel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv run --no-sync python -Werror::RuntimeWarning .github/scripts/check_windows.py "${{ matrix.python }}" ${{ !matrix.mcp && '--core-only' || '' }}

      - name: Save tested distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-wheel-windows-${{ matrix.arch }}-${{ matrix.python }}
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 30

      - name: Save test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-build-test-windows-${{ matrix.arch }}-${{ matrix.python }}
          path: test-results.xml
          retention-days: 30

  prepare-release:
    name: Validate and assemble PyPI distributions
    needs: [build-wheels, build-windows-wheels]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.13"
          python-version: "3.14+gil"

      - name: Install Python for artifact validation
        run: uv python install 3.14

      - name: Download all tested distributions into separate directories
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-wheel-*
          path: artifacts

      - name: Require all macOS and Windows wheels and select one sdist
        run: >-
          uv run --no-project python .github/scripts/prepare_release.py artifacts dist
          --version "$(uv version --short)" --release-tag "$RELEASE_TAG"

      - name: Check distribution metadata
        run: uv run --no-project --with twine twine check --strict dist/*

      - name: Save the complete PyPI upload bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pypi-distributions
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish to PyPI
    if: ${{ github.event_name == 'release' }}
    needs: prepare-release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/adb-scr-py/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pypi-distributions
          path: dist

      - name: Publish with PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

name: macOS arm64 wheels and PyPI release

on:
  release:
    types: [published]
  # A manual run builds and tests artifacts without publishing to PyPI.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build-wheels:
    name: Build on ${{ matrix.platform.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.platform.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        platform:
          - os: macos-15
            deployment_target: "15.0"
            wheel_platform: macosx-15.0-arm64
          - os: macos-26
            deployment_target: "26.0"
            wheel_platform: macosx-26.0-arm64
        python: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.14t"]
    env:
      CI_PYTHON_VERSION: ${{ matrix.python }}
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      MACOSX_DEPLOYMENT_TARGET: ${{ matrix.platform.deployment_target }}
      WHEEL_PLATFORM: ${{ matrix.platform.wheel_platform }}
      ARCHFLAGS: "-arch arm64"
      RELEASE_TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.13"
          python-version: ${{ matrix.python == '3.14' && '3.14+gil' || matrix.python }}
          enable-cache: true
          cache-dependency-glob: uv.lock
          cache-suffix: release-build-${{ matrix.platform.os }}-${{ matrix.python }}

      - name: Install the target Python interpreter
        # +gil selects an installed regular interpreter; install by version first.
        run: uv python install "$CI_PYTHON_VERSION"

      - name: Verify architecture and release version
        run: |
          test "$(uname -m)" = arm64
          sw_vers
          xcodebuild -version
          if [ "$GITHUB_EVENT_NAME" = release ]; then
            test "$RELEASE_TAG" = "v$(uv version --short)"
          fi

      - name: Install locked dependencies
        run: uv sync --locked --extra mcp --no-install-project

      - name: Build native extension in place
        run: uv run --no-sync setup.py build_ext --inplace

      - name: Build sdist and wheel for the target macOS version
        # Pin the wheel tag as well as ARCHFLAGS: some runner Pythons are universal2.
        run: |
          uv build --sdist --out-dir dist
          uv build --wheel dist/*.tar.gz --out-dir dist --config-setting="--build-option=--plat-name=$WHEEL_PLATFORM"

      - name: Install and verify the built wheel
        run: |
          uv pip install --python .venv/bin/python --no-deps dist/*.whl
          env -u PYTHON_GIL uv run --no-sync python -Werror::RuntimeWarning .github/scripts/check_ci.py "$CI_PYTHON_VERSION"
          test "$(lipo -archs .venv/lib/python*/site-packages/adb_scr/media_ext/*.so)" = arm64

      - name: Save tested distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-wheel-${{ matrix.platform.os }}-${{ matrix.python }}
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 30

      - name: Save test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-build-test-${{ matrix.platform.os }}-${{ matrix.python }}
          path: test-results.xml
          retention-days: 30

  test-macos-26:
    name: macOS 15 wheel on macOS 26 / Python ${{ matrix.python }}
    needs: build-wheels
    runs-on: macos-26
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.14t"]
    env:
      CI_PYTHON_VERSION: ${{ matrix.python }}
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.13"
          python-version: ${{ matrix.python == '3.14' && '3.14+gil' || matrix.python }}
          enable-cache: true
          cache-dependency-glob: uv.lock
          cache-suffix: release-macos-26-${{ matrix.python }}

      - name: Download the wheel and sdist built on macOS 15
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-wheel-macos-15-${{ matrix.python }}
          path: dist

      - name: Install locked dependencies and the downloaded wheel
        run: |
          test "$(uname -m)" = arm64
          sw_vers
          uv sync --locked --extra mcp --no-install-project
          uv pip install --python .venv/bin/python --no-deps dist/*.whl

      - name: Verify the same wheel on macOS 26
        run: >-
          env -u PYTHON_GIL uv run --no-sync python -Werror::RuntimeWarning
          .github/scripts/check_ci.py "$CI_PYTHON_VERSION"

      - name: Save test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-test-macos-26-${{ matrix.python }}
          path: test-results.xml
          retention-days: 30

  prepare-release:
    name: Validate and assemble PyPI distributions
    needs: [build-wheels, test-macos-26]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.13"
          python-version: "3.14+gil"

      - name: Install Python for artifact validation
        run: uv python install 3.14

      - name: Download all tested distributions into separate directories
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-wheel-*
          path: artifacts

      - name: Require six arm64 ABIs for both macOS targets and select one sdist
        run: >-
          uv run --no-project python .github/scripts/prepare_release.py artifacts dist
          --version "$(uv version --short)" --release-tag "$RELEASE_TAG"

      - name: Check distribution metadata
        run: uv run --no-project --with twine twine check --strict dist/*

      - name: Save the complete PyPI upload bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pypi-distributions
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish to PyPI
    if: ${{ github.event_name == 'release' }}
    needs: prepare-release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/adb-scr-py/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pypi-distributions
          path: dist

      - name: Publish with PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
